<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .box {
        display: inline-block;
        width: 100px;
        height: 100px;
        border: 1px solid black;
        background-color: orange;
        color: white;
        font-weight: bold;
      }

      .box--1 {
        position: relative;
        top: 0;
        right: 0;
        bottom: 0;
        left: 16px;
      }

      .container--1 {
        height: 300px;
        width: 300px;
        background-color: blue;
        /* box--4 would be referencing the container--1 with bottom and right value */
        position: relative;
      }
      .container--2 {
        height: 200px;
        width: 200px;
        background-color: rgb(86, 86, 194);
      }
      .container--3 {
        height: 100px;
        width: 100px;
        background-color: rgb(163, 163, 206);
      }
      .container--4 {
        height: 50px;
        width: 50px;
        background-color: rgb(119, 255, 0);
      }
      /* position: fixed */

      /* position: absolute */
      .box--4 {
        position: absolute;
        background-color: red;
        bottom: 2px;
        right: 2px;
      }
    </style>
  </head>
  <body>
    <div class="box box--1">One</div>
    <div class="box box--2">Two</div>
    <div class="box box--3">Three</div>

    <div class="container--1">
      <div class="container--2">
        <div class="container--3">
          <div class="container--4">
            <div class="box box--4">Four</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
